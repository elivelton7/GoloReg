name: Supabase Keep Alive

on:
  schedule:
    # Executa a cada 3 dias às 12:00 UTC para manter o projeto Supabase ativo
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_s95BhjIiSkKqbOGIunbCaA_f5-OqaW6' }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_s95BhjIiSkKqbOGIunbCaA_f5-OqaW6' }}" \
            "${{ secrets.VITE_SUPABASE_URL || 'https://xqppzwzeykwlitwzutcn.supabase.co' }}/rest/v1/page_visits?select=count&limit=1")
          
          echo "Supabase response HTTP status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Supabase pingado com sucesso! Projeto ativo."
          else
            echo "⚠️ Resposta inesperada: $STATUS"
            exit 1
          fi
